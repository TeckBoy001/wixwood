<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WixWood — Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{ --ink:#2b2118; --muted:#8b7f70; --line:#e7dcc8; --gold:#c68a3d; --paper:#fdfcfa; }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink);margin:0;padding:24px;}
  h1{font-size:20px;margin:0 0 18px;}
  .gate{max-width:360px;margin:80px auto;text-align:center;}
  .gate input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:12px 0;font-size:14px;}
  button{cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;}
  .btn-primary{background:var(--gold);color:#fff;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-danger{background:#b0503a;color:#fff;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tabs button{background:#fff;border:1px solid var(--line);color:var(--muted);}
  .tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .stars{color:var(--gold);font-size:15px;letter-spacing:1px;}
  .name{font-weight:700;}
  .piece{color:var(--muted);font-size:12.5px;}
  .comment{margin:10px 0;line-height:1.5;font-size:14px;}
  .date{color:var(--muted);font-size:12px;}
  .actions{display:flex;gap:8px;margin-top:10px;}
  .empty{color:var(--muted);text-align:center;padding:40px 0;}
  #app{display:none;max-width:760px;margin:0 auto;}
  .sections{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px;}
  .sections button{background:transparent;border:none;color:var(--muted);font-size:14px;padding:6px 2px;}
  .sections button.active{color:var(--ink);font-weight:700;border-bottom:2px solid var(--gold);border-radius:0;}
  .order-id{font-family:monospace;font-size:12.5px;color:var(--muted);}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink);text-transform:uppercase;letter-spacing:0.5px;}
  .pill.paid{background:#dcefe4;color:#1a6b3c;}
  .pill.unpaid{background:#fbe6d8;color:#a0501f;}
  .items-mini{font-size:12.5px;color:var(--muted);margin:6px 0;}
  select.status-select{font-size:12.5px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>WixWood — Admin</h1>
  <p style="color:var(--muted);font-size:14px;">Enter the admin token to continue.</p>
  <input id="tokenInput" type="password" placeholder="Admin token">
  <button class="btn-primary" onclick="enter()">Open</button>
  <p id="gateError" style="color:#b0503a;font-size:13px;"></p>
</div>

<div id="app">
  <h1 id="pageTitle">WixWood Reviews</h1>
  <div class="sections">
    <button data-section="reviews" class="active" onclick="setSection('reviews')">Reviews</button>
    <button data-section="orders" onclick="setSection('orders')">Orders</button>
  </div>

  <div id="reviewsSection">
    <div class="tabs">
      <button data-status="pending" class="active" onclick="setTab('pending')">Pending</button>
      <button data-status="approved" onclick="setTab('approved')">Approved</button>
      <button data-status="rejected" onclick="setTab('rejected')">Rejected</button>
    </div>
    <div id="list"></div>
  </div>

  <div id="ordersSection" style="display:none;">
    <div class="tabs">
      <button data-ostatus="" class="active" onclick="setOrderTab('')">All</button>
      <button data-ostatus="pending_payment" onclick="setOrderTab('pending_payment')">Awaiting payment</button>
      <button data-ostatus="paid" onclick="setOrderTab('paid')">Paid</button>
      <button data-ostatus="processing" onclick="setOrderTab('processing')">Processing</button>
      <button data-ostatus="in_production" onclick="setOrderTab('in_production')">In production</button>
      <button data-ostatus="ready_for_delivery" onclick="setOrderTab('ready_for_delivery')">Ready</button>
      <button data-ostatus="delivered" onclick="setOrderTab('delivered')">Delivered</button>
      <button data-ostatus="cancelled" onclick="setOrderTab('cancelled')">Cancelled</button>
    </div>
    <div id="orderList"></div>
  </div>
</div>

<script>
let TOKEN = sessionStorage.getItem("wixwood_admin_token") || "";
let TAB = "pending";

function enter(){
  const t = document.getElementById("tokenInput").value.trim();
  if (!t) return;
  TOKEN = t;
  sessionStorage.setItem("wixwood_admin_token", t);
  boot();
}

async function boot(){
  const res = await fetch("/api/admin/reviews?status=pending", { headers: { "x-admin-token": TOKEN } });
  if (res.status === 401) {
    document.getElementById("gateError").textContent = "That token was rejected. Check ADMIN_TOKEN on the server.";
    return;
  }
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  load();
}

function setTab(status){
  TAB = status;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.status === status));
  load();
}

function stars(n){ return "★".repeat(n) + "☆".repeat(5 - n); }
function esc(s){ return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function load(){
  const list = document.getElementById("list");
  list.innerHTML = "<p class='empty'>Loading…</p>";
  const res = await fetch("/api/admin/reviews?status=" + TAB, { headers: { "x-admin-token": TOKEN } });
  const data = await res.json();
  const reviews = data.reviews || [];
  if (!reviews.length){
    list.innerHTML = `<p class="empty">No ${TAB} reviews.</p>`;
    return;
  }
  list.innerHTML = reviews.map(r => `
    <div class="card">
      <div class="top">
        <div>
          <div class="stars">${stars(r.rating)}</div>
          <div class="name">${esc(r.name)}</div>
          ${r.piece ? `<div class="piece">${esc(r.piece)}</div>` : ""}
        </div>
        <div class="date">${new Date(r.created_at).toLocaleDateString()}</div>
      </div>
      <div class="comment">${esc(r.comment)}</div>
      <div class="actions">
        ${r.status !== "approved" ? `<button class="btn-primary" onclick="act('${r.id}','approve')">Approve</button>` : ""}
        ${r.status !== "rejected" ? `<button class="btn-outline" onclick="act('${r.id}','reject')">Reject</button>` : ""}
        <button class="btn-danger" onclick="del('${r.id}')">Delete</button>
      </div>
    </div>
  `).join("");
}

async function act(id, action){
  await fetch(`/api/admin/reviews/${id}/${action}`, { method: "POST", headers: { "x-admin-token": TOKEN } });
  load();
}
async function del(id){
  if (!confirm("Delete this review permanently?")) return;
  await fetch(`/api/admin/reviews/${id}`, { method: "DELETE", headers: { "x-admin-token": TOKEN } });
  load();
}

function setSection(section){
  document.querySelectorAll(".sections button").forEach(b => b.classList.toggle("active", b.dataset.section === section));
  document.getElementById("reviewsSection").style.display = section === "reviews" ? "block" : "none";
  document.getElementById("ordersSection").style.display = section === "orders" ? "block" : "none";
  document.getElementById("pageTitle").textContent = section === "reviews" ? "WixWood Reviews" : "WixWood Orders";
  if (section === "orders") loadOrders();
}

let OTAB = "";
function setOrderTab(status){
  OTAB = status;
  document.querySelectorAll("#ordersSection .tabs button").forEach(b => b.classList.toggle("active", b.dataset.ostatus === status));
  loadOrders();
}

const NEXT_STATUSES = ["processing","in_production","ready_for_delivery","delivered","cancelled"];
const STATUS_LABEL = {
  pending_payment: "Awaiting payment", paid: "Paid", processing: "Processing",
  in_production: "In production", ready_for_delivery: "Ready for delivery",
  delivered: "Delivered", cancelled: "Cancelled",
};
function money(n, currency){ return (currency||"NGN") + " " + Number(n).toLocaleString(); }

async function loadOrders(){
  const list = document.getElementById("orderList");
  list.innerHTML = "<p class='empty'>Loading…</p>";
  const url = "/api/admin/orders" + (OTAB ? "?status=" + OTAB : "");
  const res = await fetch(url, { headers: { "x-admin-token": TOKEN } });
  const data = await res.json();
  const orders = data.orders || [];
  if (!orders.length){
    list.innerHTML = `<p class="empty">No orders here yet.</p>`;
    return;
  }
  list.innerHTML = orders.map(o => `
    <div class="card">
      <div class="top">
        <div>
          <div class="order-id">${esc(o.id)}</div>
          <div class="name">${esc(o.customer_name)} · ${esc(o.phone)}</div>
        </div>
        <div style="text-align:right;">
          <span class="pill ${o.payment_status}">${o.payment_status}</span>
          <div class="date">${new Date(o.created_at).toLocaleString()}</div>
        </div>
      </div>
      <div class="items-mini">${o.items.map(it=>esc(it.name)+" ×"+it.qty).join(", ")}</div>
      <div class="piece">${esc(o.address)}${o.city ? ", "+esc(o.city) : ""}${o.state ? ", "+esc(o.state) : ""}</div>
      ${o.notes ? `<div class="comment">Note: ${esc(o.notes)}</div>` : ""}
      <div class="comment" style="font-weight:700;">${money(o.total, o.currency)} <span style="font-weight:400;color:var(--muted);">(items ${money(o.subtotal,o.currency)} + delivery ${money(o.delivery_fee,o.currency)})</span></div>
      <div class="actions" style="align-items:center;">
        <span class="pill">${STATUS_LABEL[o.order_status]||o.order_status}</span>
        <select class="status-select" onchange="updateOrderStatus('${o.id}', this.value)">
          <option value="">Change status…</option>
          ${NEXT_STATUSES.map(s=>`<option value="${s}">${STATUS_LABEL[s]}</option>`).join("")}
        </select>
        ${o.payment_status !== "paid" ? `<button class="btn-outline" onclick="markPaid('${o.id}')">Mark paid (offline)</button>` : ""}
      </div>
    </div>
  `).join("");
}

async function updateOrderStatus(id, status){
  if (!status) return;
  await fetch(`/api/admin/orders/${id}/status`, {
    method: "POST", headers: { "x-admin-token": TOKEN, "Content-Type": "application/json" },
    body: JSON.stringify({ status }),
  });
  loadOrders();
}
async function markPaid(id){
  if (!confirm("Confirm you've personally received payment for this order (e.g. bank transfer)? This marks it paid without going through Paystack.")) return;
  await fetch(`/api/admin/orders/${id}/mark-paid-manually`, { method: "POST", headers: { "x-admin-token": TOKEN } });
  loadOrders();
}

if (TOKEN) boot();
</script>
</body>
</html>
